name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc) - use 22.04 for broader GLIBC compatibility
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: nono-tng

          # macOS x86_64 (Intel)
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: nono-tng

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: nono-tng

          # Linux aarch64 (ARM64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: nono-tng

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && matrix.target != 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        env:
          NONO_VERSION: ${{ env.RELEASE_TAG }}
        run: cargo build --release --target ${{ matrix.target }} -p nono-cli

      - name: Build (cross aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          NONO_VERSION: ${{ env.RELEASE_TAG }}
        run: cross build --release --target aarch64-unknown-linux-gnu -p nono-cli

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../nono-tng-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          cd ../../..

      - name: Install cargo-deb
        if: runner.os == 'Linux' && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu')
        run: cargo install cargo-deb

      - name: Build .deb (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"
          cd crates/nono-cli
          cargo deb --deb-version "$VERSION"

      - name: Build .deb (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"
          cd crates/nono-cli
          cargo deb --target aarch64-unknown-linux-gnu --no-build --deb-version "$VERSION"

      - name: Prepare upload
        shell: bash
        run: |
          mkdir -p artifact_staging
          cp "nono-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz" artifact_staging/
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] && [ -d target/debian ]; then
            cp target/debian/*.deb artifact_staging/
          fi
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && [ -d target/aarch64-unknown-linux-gnu/debian ]; then
            cp target/aarch64-unknown-linux-gnu/debian/*.deb artifact_staging/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nono-${{ matrix.target }}
          path: artifact_staging

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "*.tar.gz" -exec mv {} . \;
          find . -name "*.deb" -exec mv {} . \;
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/SHA256SUMS.txt

  # Publishes a Homebrew formula for nono-tng to the shared
  # TNG-release/homebrew-tap repository. Runs only AFTER the GitHub Release
  # has been created (so the tarball download URLs resolve) and only for
  # non-prerelease tags. The latter is decided by inspecting RELEASE_TAG:
  # anything with a hyphen (v1.2.3-rc1, ...) is treated as a prerelease and
  # skipped, matching SemVer 2.0.0 prerelease semantics. Override by
  # setting the workflow_dispatch input or by adjusting the condition
  # below.
  publish-homebrew-formula:
    name: Publish Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    # Skip prereleases (anything containing a hyphen after the version).
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    steps:
      - name: Download release tarballs
        # We need each platform tarball's SHA-256 to bake into the formula.
        # The release job already produced SHA256SUMS.txt; pull it from
        # the release we just created so we don't have to recompute hashes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p formula-build
          cd formula-build
          gh release download "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --pattern 'SHA256SUMS.txt'
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Render Formula/nono.rb
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd formula-build

          # Strip leading 'v' for use inside the formula's `version` field.
          VERSION="${TAG#v}"

          # Look up each per-target SHA-256 from SHA256SUMS.txt. The file
          # has the format:
          #   <sha>  nono-tng-${TAG}-${TARGET}.tar.gz
          sha_for() {
            local target="$1"
            local file="nono-tng-${TAG}-${target}.tar.gz"
            local sha
            sha=$(awk -v f="$file" '$2 == f {print $1}' SHA256SUMS.txt)
            if [ -z "$sha" ]; then
              echo "FATAL: no SHA-256 entry for $file in SHA256SUMS.txt" >&2
              echo "Available entries:" >&2
              cat SHA256SUMS.txt >&2
              exit 1
            fi
            printf '%s' "$sha"
          }

          SHA_DARWIN_X86=$(sha_for x86_64-apple-darwin)
          SHA_DARWIN_ARM=$(sha_for aarch64-apple-darwin)
          SHA_LINUX_X86=$(sha_for  x86_64-unknown-linux-gnu)
          SHA_LINUX_ARM=$(sha_for  aarch64-unknown-linux-gnu)

          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          mkdir -p Formula
          cat > Formula/nono-tng.rb <<RUBY
          # frozen_string_literal: true
          # This file is auto-generated by the TNG/nono release pipeline.
          # Do not edit by hand; changes will be overwritten on the next release.
          class NonoTng < Formula
            desc "Capability-based sandbox for running untrusted commands (TNG fork)"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "${BASE_URL}/nono-tng-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_DARWIN_ARM}"
              end
              on_intel do
                url "${BASE_URL}/nono-tng-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_DARWIN_X86}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/nono-tng-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
              on_intel do
                url "${BASE_URL}/nono-tng-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            def install
              bin.install "nono-tng"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/nono-tng --version")
            end
          end
          RUBY

          echo "--- Generated Formula/nono-tng.rb ---"
          cat Formula/nono-tng.rb

      - name: Push formula to TNG-release/homebrew-tap
        env:
          # Fine-grained PAT scoped to TNG-release/homebrew-tap with
          # Contents: read & write. Stored as a repo secret on TNG/nono.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "FATAL: HOMEBREW_TAP_TOKEN secret is not set on this repo." >&2
            echo "Create a fine-grained PAT scoped to TNG-release/homebrew-tap" >&2
            echo "with 'Contents: read and write' and add it as a repo secret." >&2
            exit 1
          fi

          cd formula-build
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/TNG-release/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp Formula/nono-tng.rb tap/Formula/nono-tng.rb

          cd tap
          git config user.name  "tng-release-bot"
          git config user.email "[email protected]"
          git add Formula/nono-tng.rb

          if git diff --cached --quiet; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi

          git commit -m "chore(formula): bump nono-tng to ${TAG}"
          git push origin HEAD:main